# PostgreSQL cluster for the state-store comparison (A.2): CloudNativePG operator and a 3-instance cluster
# (one primary, two synchronous-capable replicas) from the official charts, sized like the PXC and rqlite
# test deployments. Set the cluster's StorageClass with `--state-values-set storageClass=<name>` or edit below.
repositories:
  - name: cnpg
    url: https://cloudnative-pg.github.io/charts

---
releases:
  - name: cnpg
    namespace: cnpg-system
    createNamespace: true
    chart: cnpg/cloudnative-pg
    version: 0.29.1

  - name: pgbench
    namespace: pgbench
    createNamespace: true
    chart: cnpg/cluster
    version: 0.9.0
    needs: [cnpg-system/cnpg]
    values:
      - cluster:
          instances: 3
          storage:
            size: 5Gi
          resources:
            requests: {cpu: 200m, memory: 900Mi}
            limits: {cpu: 200m, memory: 900Mi}
          postgresql:
            parameters:
              shared_buffers: 128MB
            synchronous:
              method: any
              number: 1
              dataDurability: required
          initdb:
            database: bench
            owner: bench
