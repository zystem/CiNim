# The rights of the deploy step of .ci/pipeline.lua (D-48, D-115): what the Pod of that step may do in the cluster, so that it can roll the platform out with Helm (`helm upgrade --atomic
# --wait` of the shard and of the storage module). The credential is **the Pod's own token**. The organisation that builds the platform has a deploy profile `platform` (PUT
# /api/v1/organizations/<slug>/deploy-profiles/platform {"service_account": "cinim-deployer", "namespace": "cinim-001"}) and its project lists the profile in `allowed_profiles`; the
# core makes the ServiceAccount `cinim-deployer` in the namespace of the organisation, the controller runs the Pods of a step of that profile (and only those) as it with its token
# mounted, and `helm` and `kubectl` find it as the in-cluster configuration. There is no secret to make, renew or lose. (A deployment to another cluster is a step with the token and
# the CA of that cluster as step secrets, D-45, and needs none of this; one into this cluster that is smaller than this file is a profile whose account is bound to a smaller Role,
# in one namespace, in those that begin so (`test*`), or in all (a ClusterRoleBinding).) This file holds the rights of this one: a Role and a ClusterRole, bound to the account of the organisation that runs the pipeline (here `cinim-001-selfci`).
# These are **extended rights**, which is what the deploy profile is for: they can change everything the two charts own in the namespace of the shard (the Deployments, the StatefulSet of
# rqlite, the Services, the Secrets that hold the Helm releases, the ConfigMaps, the Roles) and the cluster-wide objects of the shard chart (its ClusterRoles and the admission policy);
# because they may write ClusterRoles they can give themselves more than they have (`escalate`, `bind`). What guards them is the platform: a deploy step runs only for a project that lists
# the profile in `allowed_profiles` and only on a protected ref (D-86), so allow it in the organisation that builds the platform and no other.
# Apply it in the namespace of the shard (cinim-<shard>); change `cinim-001-selfci` to <namespace of the shard>-<slug of the organisation>:
#
#   kubectl -n cinim-001 apply -f deployer.yaml
#
# The token is a projected one, valid for an hour and renewed by the kubelet; it exists only in the Pod of a deploy step. The step needs no CA and no address: the Pod finds the API server
# by the environment (KUBERNETES_SERVICE_HOST), and `deploy.kubeApiServer: true` lets it reach it (docs/deployment.md "Where the images go" and the deploy profile).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: cinim-deployer}
rules:
  # the objects of the two charts, and the Secrets that Helm keeps its releases in
  - apiGroups: [""]
    resources: [configmaps, secrets, services, serviceaccounts, persistentvolumeclaims, resourcequotas, limitranges, endpoints]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cinim-deployer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: cinim-deployer}
subjects:
  - {kind: ServiceAccount, name: cinim-deployer, namespace: cinim-001-selfci}
---
# the cluster-wide objects of the shard chart: its ClusterRoles (the core's, the step role) and their bindings, and the admission policy that keeps the core inside its namespaces
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: cinim-001-deployer}
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, watch, create, update, patch, delete, escalate, bind]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [validatingadmissionpolicies, validatingadmissionpolicybindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: cinim-001-deployer}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cinim-001-deployer}
subjects:
  - {kind: ServiceAccount, name: cinim-deployer, namespace: cinim-001-selfci}
