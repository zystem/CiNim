apiVersion: v1
kind: Namespace
metadata: {name: cinim-ci}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: claude, namespace: cinim-ci}
---
# What building and testing CiNim on a cluster needs: install the chart (namespaces, workloads, the core's cluster role and the admission
# policies), make organisations (the core does that with its own rights), run Kaniko build Pods and read what happened. `escalate` and `bind`
# are needed because the chart creates ClusterRoles that hold rights the installer must be allowed to hand out: this role is therefore as good
# as an administrator of the cluster. Give it only to a test cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: claude-cinim-test}
rules:
  - {apiGroups: [""], resources: [namespaces], verbs: [get, list, watch, create, update, patch, delete]}
  - {apiGroups: [""], resources: [pods, pods/log, pods/exec, pods/portforward, services, endpoints, configmaps, secrets, serviceaccounts, persistentvolumeclaims, resourcequotas, limitranges, events], verbs: ["*"]}
  - {apiGroups: [""], resources: [nodes, persistentvolumes], verbs: [get, list, watch]}
  - {apiGroups: [apps], resources: [deployments, statefulsets, replicasets, daemonsets], verbs: ["*"]}
  - {apiGroups: [batch], resources: [jobs, cronjobs], verbs: ["*"]}
  - {apiGroups: [policy], resources: [poddisruptionbudgets], verbs: ["*"]}
  - {apiGroups: [networking.k8s.io], resources: [networkpolicies, ingresses], verbs: ["*"]}
  - {apiGroups: [rbac.authorization.k8s.io], resources: [roles, rolebindings, clusterroles, clusterrolebindings], verbs: ["*", escalate, bind]}
  - {apiGroups: [admissionregistration.k8s.io], resources: [validatingadmissionpolicies, validatingadmissionpolicybindings], verbs: ["*"]}
  - {apiGroups: [storage.k8s.io], resources: [storageclasses], verbs: [get, list]}
  - {apiGroups: [coordination.k8s.io], resources: [leases], verbs: ["*"]}
  - {apiGroups: [metrics.k8s.io], resources: [pods, nodes], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: claude-cinim-test}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: claude-cinim-test}
subjects: [{kind: ServiceAccount, name: claude, namespace: cinim-ci}]
