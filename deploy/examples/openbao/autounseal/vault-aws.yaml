# Vault for the key of the shard, unsealed by itself with AWS KMS (deploy/examples/openbao/autounseal/README.md). The official chart, `hashicorp/vault`. Vault carries the cloud seals itself (no plugin).
# Replace what is in <angle brackets>. The Service is `vault` in the namespace of the shard, the certificate is vault-tls.yaml.
global:
  tlsDisable: false
injector:
  enabled: false
server:
  standalone:
    enabled: true
    config: |
      ui = false
      listener "tcp" {
        address         = "[::]:8200"
        cluster_address = "[::]:8201"
        tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
        tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
      }
      storage "file" {
        path = "/vault/data"
      }
      seal "awskms" {
        region     = "<us-east-1>"
        kms_key_id = "<key id, ARN or alias/name>"      # a symmetric key, ENCRYPT_DECRYPT; the identity needs kms:Encrypt, kms:Decrypt, kms:DescribeKey on it
      }
  volumes:
    - name: vault-tls
      secret: {secretName: vault-tls}
  volumeMounts:
    - {name: vault-tls, mountPath: /vault/userconfig/vault-tls, readOnly: true}
  extraEnvironmentVars:
    VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt        # for `vault` inside the Pod (the chart sets VAULT_ADDR)
  # Who the Pod is, one of the two. The seal reads the usual AWS variables.
  # (a) outside AWS, or without IRSA: the access key of an IAM user that may use the key (`kubectl create secret generic aws-kms --from-literal=access_key=... --from-literal=secret_key=...`)
  extraSecretEnvironmentVars:
    - {envName: AWS_ACCESS_KEY_ID, secretName: aws-kms, secretKey: access_key}
    - {envName: AWS_SECRET_ACCESS_KEY, secretName: aws-kms, secretKey: secret_key}
  # (b) on EKS: the role of the service account (IRSA) and no Secret; delete (a), uncomment:
  # serviceAccount:
  #   annotations:
  #     eks.amazonaws.com/role-arn: arn:aws:iam::<account>:role/<role that may use the key>
  dataStorage:
    size: 1Gi
