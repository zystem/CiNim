# Two HTTP store nodes of the shard (docs/store.md, D-57, D-58): Caddy with the WebDAV module of the CiNim fork, a StatefulSet of two Pods, each with a volume of its own. They know nothing
# of each other: the core writes to both and repairs from its database. A node keeps no secret: its `forward_auth` asks the core whether each request is good (core/storeauth.nim), so the
# core's Service must be reachable from the nodes (CORE below); the nodes' port is for the core only.
#
#   kubectl -n <namespace> apply -f caddy-store.yaml
#   curl -X PUT .../api/v1/storage -d '{"kind":"dav","nodes":["http://cinim-store-dav-0.cinim-store-dav:8080","http://cinim-store-dav-1.cinim-store-dav:8080"],"token":"<any 8..256 characters>"}'
#
# The id of a node in the request is its `host:port` as the core writes it: `cinim-store-dav-0.cinim-store-dav:8080`. The Caddyfile below says the same in `uri ...?node=`, from the name of the Pod
# (the environment variable NODE_ID is made from it by the shell of the container). For https between the nodes and the core, give the nodes a certificate (`tls /certs/tls.crt /certs/tls.key`
# in the site block) and the core CINIM_STORE_CA; inside a network that is encrypted anyway, http is what is measured in docs/store.md.
# The image is built with TARGETS=caddy-store:cinim-store-dav tools/image/kaniko-build.sh.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinim-store-dav
  labels: {app.kubernetes.io/name: cinim-store-dav, app.kubernetes.io/part-of: cinim}
data:
  Caddyfile: |
    {
      order webdav before file_server
      auto_https off
      admin off
    }
    :8080 {
      # the probes of the Pod need no token
      handle /__health {
        respond 200
      }
      handle {
        forward_auth {$CORE} {
          uri /api/v1/internal/store-auth?node={$NODE_ID}:8080
        }
        webdav {
          root /data
          atomic_put
          create_dirs
          sync full
          tmp_age 24h
        }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: cinim-store-dav
  labels: {app.kubernetes.io/name: cinim-store-dav, app.kubernetes.io/part-of: cinim}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app.kubernetes.io/name: cinim-store-dav}
  ports:
    - {name: http, port: 8080, targetPort: http}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cinim-store-dav
  labels: {app.kubernetes.io/name: cinim-store-dav, app.kubernetes.io/part-of: cinim}
spec:
  serviceName: cinim-store-dav
  replicas: 2
  podManagementPolicy: Parallel
  selector:
    matchLabels: {app.kubernetes.io/name: cinim-store-dav}
  template:
    metadata:
      labels: {app.kubernetes.io/name: cinim-store-dav, app.kubernetes.io/part-of: cinim}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      # one node per machine: the two copies are not on one disk
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector: {matchLabels: {app.kubernetes.io/name: cinim-store-dav}}
      terminationGracePeriodSeconds: 30
      containers:
        - name: store
          image: REGISTRY/cinim-store-dav:TAG
          # NODE_ID is the host:port-less name the core uses for this Pod: <pod>.<service>; the Caddyfile adds the port
          command: [sh, -c, 'NODE_ID="$(hostname).cinim-store-dav" exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile']
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: CORE, value: "cinim-core:18081"}          # the Service of the core's API
            - {name: XDG_DATA_HOME, value: /tmp/xdg}
            - {name: XDG_CONFIG_HOME, value: /tmp/xdgc}
          readinessProbe: {httpGet: {path: /__health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /__health, port: http}, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 6}
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: config, mountPath: /etc/caddy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: cinim-store-dav}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 200Gi}}
---
# only the core reaches a node
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cinim-store-dav
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: cinim-store-dav}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: cinim-core}}
      ports:
        - {protocol: TCP, port: 8080}
