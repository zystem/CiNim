{{- if .Values.networkPolicy.enabled }}
# Who may reach what: the service is reached by the core of the shard and by what this chart installs (Garage's sidecar and the Job register stores); Garage is reached by the service only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cinim-storage
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cinim-storage.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: cinim-storage, app.kubernetes.io/instance: {{ .Release.Name }}}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {{- toYaml .Values.networkPolicy.coreLabels | nindent 14 }}
        - podSelector: {matchLabels: {app.kubernetes.io/part-of: cinim-storage}}
      ports:
        - {protocol: TCP, port: {{ .Values.blobgate.config.port }}}
{{- if .Values.blobgate.config.shimPort }}
    # D-61: the shims of the shard's organisations reach the port for shims and no other port of the service
    - from:
        - namespaceSelector:
            matchLabels: {cinim.io/shard: {{ .Values.shard | quote }}}
      ports:
        - {protocol: TCP, port: {{ .Values.blobgate.config.shimPort }}}
{{- end }}
{{- if .Values.stores.garage.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cinim-storage-garage
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cinim-storage.labels" . | nindent 4 }}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: cinim-storage-garage}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: cinim-storage, app.kubernetes.io/instance: {{ .Release.Name }}}}
      ports:
        - {protocol: TCP, port: 3900}
        - {protocol: TCP, port: 3903}        # /metrics: how much room the volume has (the service refuses an upload that would fill it)
{{- end }}
{{- end }}
