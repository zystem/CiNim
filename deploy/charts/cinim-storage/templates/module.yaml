# The module: a Deployment with no volume; everything it keeps is in rqlite (docs/storage-module.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinim-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cinim-storage
    {{- include "cinim-storage.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/name: cinim-storage}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinim-storage
        {{- include "cinim-storage.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: storage
          image: {{ include "cinim-storage.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/cinim-storage"]
          ports:
            - {name: http, containerPort: 18090}
            {{- if .Values.shim.port }}
            - {name: shim, containerPort: {{ .Values.shim.port }}}
            {{- end }}
          env:
            - {name: CINIM_RQLITE_URL, value: {{ .Values.rqliteUrl | quote }}}
            - {name: CINIM_STORAGE_PORT, value: "18090"}
            - {name: CINIM_STORAGE_SHIM_PORT, value: {{ .Values.shim.port | int | quote }}}
            - {name: CINIM_STORAGE_SHIM_THREADS, value: {{ .Values.shim.threads | int | quote }}}
            - {name: CINIM_STORAGE_THREADS, value: {{ .Values.module.threads | int | quote }}}
            - {name: CINIM_STORAGE_REPAIR_SECONDS, value: {{ .Values.repairSeconds | int | quote }}}
            - {name: CINIM_STORAGE_CHECK_SECONDS, value: {{ .Values.checkSeconds | int | quote }}}
            - name: CINIM_STORAGE_SHARDS
              valueFrom: {secretKeyRef: {name: {{ include "cinim-storage.secret" . }}, key: shards}}
            - name: CINIM_STORAGE_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: {{ include "cinim-storage.secret" . }}, key: adminToken}}
            - name: CINIM_STORAGE_SEAL_KEY
              valueFrom: {secretKeyRef: {name: {{ include "cinim-storage.secret" . }}, key: sealKey}}
            - name: HOSTNAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 20, failureThreshold: 6}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml .Values.module.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: cinim-storage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cinim-storage
    {{- include "cinim-storage.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: cinim-storage}
  ports:
    - {name: http, port: 18090, targetPort: http}
    {{- if .Values.shim.port }}
    - {name: shim, port: {{ .Values.shim.port }}, targetPort: shim}
    {{- end }}
