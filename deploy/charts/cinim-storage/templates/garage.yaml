{{- if .Values.stores.garage.enabled }}
{{- $g := .Values.stores.garage }}
# Garage (https://garagehq.deuxfleurs.fr), one node on one volume (replication_factor 1: the volume is the only copy, so back it up). The sidecar `init` makes the layout, the
# bucket and an access key through Garage's admin API, once (it only makes what is missing), keeps the key on the volume, and tells the storage module about the store:
# `POST /v1/admin/stores/<name>` with the key, repeated at every start of the Pod until the module takes it. The node's own secrets are made on the volume at the first start.
apiVersion: v1
kind: ConfigMap
metadata:
  name: cinim-storage-garage
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cinim-storage.labels" . | nindent 4 }}
data:
  garage.toml: |
    metadata_dir = "/var/lib/garage/meta"
    data_dir = "/var/lib/garage/data"
    db_engine = "sqlite"
    replication_factor = 1
    rpc_bind_addr = "[::]:3901"
    rpc_secret_file = "/var/lib/garage/secrets/rpc_secret"
    [s3_api]
    s3_region = "garage"
    api_bind_addr = "[::]:3900"
    [admin]
    api_bind_addr = "[::]:3903"
    admin_token_file = "/var/lib/garage/secrets/admin_token"
  init.sh: |
    #!/bin/sh
    # Makes the layout, the bucket and the key through the admin API, then registers the store with the module; idempotent. busybox only (wget, sed, tr).
    set -eu
    API=http://127.0.0.1:3903
    TOKEN=$(cat /var/lib/garage/secrets/admin_token)
    BUCKET=${BUCKET:-cinim-artifacts}
    KEYNAME=${KEYNAME:-cinim}
    CAPACITY=${CAPACITY:-7000000000}
    get()  { wget -qO- --header="Authorization: Bearer $TOKEN" "$API$1"; }
    post() { wget -qO- --header="Authorization: Bearer $TOKEN" --header="Content-Type: application/json" --post-data="$2" "$API$1"; }
    {{- include "cinim-storage.registerFn" . | nindent 4 }}
    until get /v2/GetClusterStatus >/dev/null 2>&1; do sleep 2; done
    status=$(get /v2/GetClusterStatus)
    if ! echo "$status" | tr -d ' \n' | grep -q '"role":{'; then
      id=$(echo "$status" | tr -d ' \n' | sed -n 's/.*"nodes":\[{"id":"\([0-9a-f]*\)".*/\1/p')
      version=$(echo "$status" | tr -d ' \n' | sed -n 's/.*"layoutVersion":\([0-9]*\).*/\1/p')
      post /v2/UpdateClusterLayout "{\"roles\":[{\"id\":\"$id\",\"zone\":\"dc1\",\"capacity\":$CAPACITY,\"tags\":[]}]}" >/dev/null
      post /v2/ApplyClusterLayout "{\"version\":$((version + 1))}" >/dev/null
      echo "garage: layout applied for node $id ($CAPACITY bytes)"
    fi
    keyfile=/var/lib/garage/secrets/cinim-s3
    if [ ! -s "$keyfile" ]; then
      key=$(post /v2/CreateKey "{\"name\":\"$KEYNAME\"}" | tr -d ' \n')
      kid=$(echo "$key" | sed -n 's/.*"accessKeyId":"\([^"]*\)".*/\1/p')
      sec=$(echo "$key" | sed -n 's/.*"secretAccessKey":"\([^"]*\)".*/\1/p')
      [ -n "$kid" ] && [ -n "$sec" ] || { echo "garage: no key in the answer"; exit 1; }
      (umask 077; printf 'accessKeyId=%s\nsecretAccessKey=%s\n' "$kid" "$sec" > "$keyfile")
      echo "garage: key $KEYNAME made ($kid)"
    fi
    kid=$(sed -n 's/^accessKeyId=//p' "$keyfile")
    sec=$(sed -n 's/^secretAccessKey=//p' "$keyfile")
    if ! get "/v2/GetBucketInfo?globalAlias=$BUCKET" >/dev/null 2>&1; then
      post /v2/CreateBucket "{\"globalAlias\":\"$BUCKET\"}" >/dev/null
      echo "garage: bucket $BUCKET made"
    fi
    bid=$(get "/v2/GetBucketInfo?globalAlias=$BUCKET" | tr -d ' \n' | sed -n 's/^{"id":"\([0-9a-f]*\)".*/\1/p')
    post /v2/AllowBucketKey "{\"bucketId\":\"$bid\",\"accessKeyId\":\"$kid\",\"permissions\":{\"read\":true,\"write\":true,\"owner\":true}}" >/dev/null
    echo "garage: ready, bucket $BUCKET, key $kid"
    register "$STORE_NAME" "{\"endpoint\":\"http://cinim-storage-garage:3900\",\"region\":\"garage\",\"bucket\":\"$BUCKET\",\"access_key_id\":\"$kid\",\"secret_access_key\":\"$sec\",\"default\":$STORE_DEFAULT}"
    exec sleep 2147483647
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: cinim-storage-garage
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: cinim-storage-garage
    {{- include "cinim-storage.labels" . | nindent 4 }}
spec:
  serviceName: cinim-storage-garage
  replicas: 1
  selector: {matchLabels: {app.kubernetes.io/name: cinim-storage-garage}}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinim-storage-garage
        {{- include "cinim-storage.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        - name: secrets       # the node's own secrets, once, on the volume
          image: {{ .Values.tools.image | quote }}
          command: ["sh", "-c"]
          args:
            - |
              set -eu
              mkdir -p /var/lib/garage/secrets /var/lib/garage/meta /var/lib/garage/data
              for f in rpc_secret admin_token; do
                [ -s /var/lib/garage/secrets/$f ] || (umask 077; head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n' > /var/lib/garage/secrets/$f)
              done
              # fsGroup makes the kubelet add group read and write to every file of the volume each time the Pod is mounted, and Garage refuses to start
              # with a secret that others can read ("world-readable! (mode: 0660)"): the modes are put back to 600 at every start, before Garage runs
              chmod 600 /var/lib/garage/secrets/*
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          volumeMounts: [{name: data, mountPath: /var/lib/garage}]
      containers:
        - name: garage
          image: {{ $g.image | quote }}
          command: ["/garage", "-c", "/etc/garage/garage.toml", "server"]
          ports: [{name: s3, containerPort: 3900}, {name: rpc, containerPort: 3901}, {name: admin, containerPort: 3903}]
          readinessProbe: {tcpSocket: {port: 3900}, periodSeconds: 5}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{- toYaml $g.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/garage}
            - {name: config, mountPath: /etc/garage, readOnly: true}
        - name: init
          image: {{ .Values.tools.image | quote }}
          command: ["sh", "/scripts/init.sh"]
          env:
            {{- include "cinim-storage.adminEnv" . | nindent 12 }}
            - {name: BUCKET, value: {{ $g.bucket | quote }}}
            - {name: CAPACITY, value: {{ $g.capacityBytes | int64 | quote }}}
            - {name: STORE_NAME, value: {{ $g.name | quote }}}
            - {name: STORE_DEFAULT, value: {{ $g.default | quote }}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 5m, memory: 8Mi}, limits: {memory: 32Mi}}
          volumeMounts:
            - {name: data, mountPath: /var/lib/garage}
            - {name: config, mountPath: /scripts, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cinim-storage-garage, items: [{key: garage.toml, path: garage.toml}, {key: init.sh, path: init.sh}]}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if $g.persistence.storageClass }}
        storageClassName: {{ $g.persistence.storageClass | quote }}
        {{- end }}
        resources: {requests: {storage: {{ $g.persistence.size | quote }}}}
---
apiVersion: v1
kind: Service
metadata:
  name: cinim-storage-garage
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cinim-storage.labels" . | nindent 4 }}
spec:
  selector: {app.kubernetes.io/name: cinim-storage-garage}
  ports: [{name: s3, port: 3900, targetPort: 3900}]
{{- end }}
