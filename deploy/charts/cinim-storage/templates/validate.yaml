{{- if .Values.secrets.shards }}
{{- range $shard, $sec := .Values.secrets.shards }}
{{- if not (regexMatch "^[0-9]{1,16}$" (toString $shard)) }}{{ fail (printf "a shard is made of digits only (SHD-001): %q" $shard) }}{{ end }}
{{- if lt (len (toString $sec)) 16 }}{{ fail (printf "the secret of shard %s is shorter than 16 characters" $shard) }}{{ end }}
{{- end }}
{{- if lt (len .Values.secrets.adminToken) 16 }}{{ fail "secrets.adminToken is shorter than 16 characters" }}{{ end }}
{{- if lt (len .Values.secrets.sealKey) 16 }}{{ fail "secrets.sealKey is shorter than 16 characters" }}{{ end }}
{{- end }}
{{- if not .Values.blobgate.existingSecret }}{{ fail "blobgate.existingSecret names the Secret of the service (made by this chart from `secrets`, or yours)" }}{{ end }}
{{- if not (or .Values.stores.garage.enabled .Values.stores.external .Values.stores.mirrors) }}{{ fail "no store is on: enable stores.garage, or list stores.external or stores.mirrors" }}{{ end }}
