{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: cinim-storage
  namespace: {{ .Release.Namespace }}
  labels: {{- include "cinim-storage.labels" . | nindent 4 }}
type: Opaque
stringData:
  shards: {{ include "cinim-storage.shards" . | quote }}
  adminToken: {{ .Values.secrets.adminToken | quote }}
  sealKey: {{ .Values.secrets.sealKey | quote }}
  nodeToken: {{ .Values.secrets.nodeToken | quote }}
  {{- range $shard, $sec := .Values.secrets.shards }}
  {{ printf "shard-%s" (toString $shard) }}: {{ $sec | quote }}
  {{- end }}
{{- end }}
