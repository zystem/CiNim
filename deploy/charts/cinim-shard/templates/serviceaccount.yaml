apiVersion: v1
kind: ServiceAccount
metadata:
  name: cinim-core
  namespace: {{ include "cinim-shard.ns" . }}
automountServiceAccountToken: true
---
# The executor needs no right in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cinim-executor
  namespace: {{ include "cinim-shard.ns" . }}
automountServiceAccountToken: false
