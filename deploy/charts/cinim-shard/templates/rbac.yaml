# The only cluster-wide right of the core (SHD-007, T-45): namespaces and the objects of an organisation. It may create and delete
# these objects and nothing else; the ValidatingAdmissionPolicy (admissionpolicy.yaml) keeps every such request inside
# {{ include "cinim-shard.ns" . }}-*. Reading Secrets and the like is not granted, so the reconciliation (SHD-008) creates and
# treats "already exists" as done; it reads only namespaces and the state volume of a controller.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cinim-shard.ns" . }}-core
  labels:
    {{- include "cinim-shard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [serviceaccounts, secrets, resourcequotas, limitranges, persistentvolumeclaims]
    verbs: [create, delete]
  # the reconciliation (SHD-008) asks whether the state volume of a controller is still there: a volume's metadata is all it reads
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [create, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [create, delete]
{{- if and .Values.deploy.enabled .Values.deploy.kubeApiServer }}
  # the deploy profile (D-48) reaches the API server through a CiliumNetworkPolicy that the core makes in the namespace of each organisation
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [create, delete]
{{- end }}
  # giving the step role away is allowed for that role only
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    verbs: [bind]
    resourceNames: [{{ include "cinim-shard.stepRunner" . | quote }}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cinim-shard.ns" . }}-core
  labels:
    {{- include "cinim-shard.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cinim-shard.ns" . }}-core
subjects:
  - kind: ServiceAccount
    name: cinim-core
    namespace: {{ include "cinim-shard.ns" . }}
---
# What the job controller of an organisation may do in the namespace of that organisation (the core binds it with a RoleBinding there).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cinim-shard.stepRunner" . }}
  labels:
    {{- include "cinim-shard.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # only to pull an undelivered spool out of a Pod (D-29); without it that fallback does not run
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps, secrets]
    verbs: [create, get, delete]
  # the shim travels in a ConfigMap that the controller replaces at start, so that a new controller image brings its own shim
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [update]
  # the controller reads the storage quota of its namespace and reports how full it is, so that the core keeps the volumes of failed runs shorter when it is nearly full (STO-006)
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get]
  - apiGroups: [""]
    resources: [persistentvolumeclaims, services]
    verbs: [create, get, list, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, get, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  # read the events about a finished step Pod (why it was not scheduled, evicted, killed): the cluster forgets them after about an hour
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
{{- if eq .Values.mode "multi" }}
---
# multi mode: the core creates and deletes the Ingress <basePath>/<slug>/ of an organisation in the namespace of the shard.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cinim-core-ingress
  namespace: {{ include "cinim-shard.ns" . }}
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cinim-core-ingress
  namespace: {{ include "cinim-shard.ns" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cinim-core-ingress
subjects:
  - kind: ServiceAccount
    name: cinim-core
    namespace: {{ include "cinim-shard.ns" . }}
{{- end }}
