# One replica: the core holds the queue, the leases and the log circuit of the shard in one process (D-23).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinim-core
  namespace: {{ include "cinim-shard.ns" . }}
  labels:
    app.kubernetes.io/name: cinim-core
    {{- include "cinim-shard.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cinim-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinim-core
        {{- include "cinim-shard.labels" . | nindent 8 }}
    spec:
      serviceAccountName: cinim-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          image: {{ include "cinim-shard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/core"]
          ports:
            - {name: http, containerPort: 18081}
            - {name: controller, containerPort: 19740}
            - {name: executor, containerPort: 19741}
            - {name: stepreport, containerPort: 19742}
            - {name: logingest, containerPort: 19743}
          env:
            - {name: CINIM_SHARD, value: {{ .Values.shard | quote }}}
            - {name: CINIM_NAMESPACE_PREFIX, value: {{ .Values.namespacePrefix | quote }}}
            - {name: CINIM_PUBLIC_URL, value: {{ include "cinim-shard.publicUrl" . | quote }}}
            - {name: CINIM_RQLITE_URL, value: {{ include "cinim-shard.rqliteUrl" . | quote }}}
            - {name: CINIM_VICTORIALOGS_URL, value: {{ include "cinim-shard.victoriaLogsUrls" . | quote }}}
            - {name: CINIM_VLAGENT_URL, value: {{ include "cinim-shard.vlagentUrl" . | quote }}}
            - {name: CINIM_METRICS, value: {{ .Values.metrics.enabled | quote }}}
            - {name: CINIM_CERTS, value: /etc/cinim}
            # what the core makes the objects of an organisation from (SHD-007)
            - {name: CINIM_CONTROLLER_IMAGE, value: {{ include "cinim-shard.controllerImage" . | quote }}}
            - {name: CINIM_CONTROLLER_STATE_CLASS, value: {{ .Values.controller.stateStorageClass | quote }}}
            - {name: CINIM_STEP_EPHEMERAL_LIMIT, value: {{ .Values.steps.ephemeralStorageLimit | quote }}}
            - {name: CINIM_INGRESS_CLASS, value: {{ .Values.ingress.className | quote }}}
            - {name: CINIM_INGRESS_TLS_SECRET, value: {{ .Values.ingress.tls.secretName | quote }}}
            - {name: CINIM_INGRESS_ANNOTATIONS, value: {{ .Values.ingress.annotations | toJson | quote }}}
            # the build profile (D-42, A.13): the namespace of an organisation is `baseline` under the build-pod policy of this chart, and the
            # controller of the organisation makes a build Pod of a step that asks for it
            - {name: CINIM_BUILD, value: {{ ternary "on" "off" .Values.build.enabled | quote }}}
            {{- if .Values.build.enabled }}
            - {name: CINIM_BUILD_EGRESS, value: {{ .Values.build.egress | toJson | quote }}}   # a list of rules, or the string "all"
            - {name: CINIM_BUILD_INTERNET, value: {{ if .Values.build.internet.enabled }}{{ dict "ports" .Values.build.internet.ports "except" .Values.build.internet.except | toJson | quote }}{{ else }}"off"{{ end }}}
            - {name: CINIM_BUILD_CAPS, value: {{ join "," .Values.build.capabilities | quote }}}
            - {name: CINIM_BUILD_MEMORY_LIMIT, value: {{ .Values.build.memoryLimit | quote }}}
            - {name: CINIM_BUILD_EPHEMERAL_LIMIT, value: {{ .Values.build.ephemeralStorageLimit | quote }}}
            - {name: CINIM_BUILD_SECCOMP, value: {{ .Values.build.seccompProfile | quote }}}
            - {name: CINIM_BUILD_INGRESS, value: {{ .Values.build.ingress | toJson | quote }}}   # a list of rules, or the string "all"
            {{- end }}
            {{- if .Values.auth.enabled }}
            # IAM-003: without a token or CINIM_AUTH=on the API is open
            - {name: CINIM_AUTH, value: "on"}
            {{- if or .Values.auth.adminToken .Values.auth.adminTokenSecret }}
            - name: CINIM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default "cinim-admin-token" .Values.auth.adminTokenSecret }}
                  key: token
            {{- end }}
            {{- end }}
            # the reconciliation of the organisations with their objects and the retention of a switched-off one (SHD-008)
            - {name: CINIM_ORG_RECONCILE_INTERVAL, value: {{ int64 .Values.organizations.reconcileInterval | quote }}}
            # int64: Helm reads a YAML integer as a float, and 1209600 would be printed as 1.2096e+06
            - {name: CINIM_ORG_RETENTION, value: {{ int64 .Values.organizations.retention | quote }}}
            # the simple mode of a small organisation (SHD-009): every step Pod may reach any address / be reached from any
            - {name: CINIM_NETWORK_EGRESS, value: {{ .Values.network.egress | quote }}}
            - {name: CINIM_NETWORK_INGRESS, value: {{ .Values.network.ingress | quote }}}
            {{- if eq .Values.mode "multi" }}
            - {name: CINIM_ROUTER_URL, value: {{ required "routerUrl is required in the multi mode" .Values.routerUrl | quote }}}
            - {name: CINIM_ROUTER_INTERVAL, value: {{ .Values.routerInterval | quote }}}
            - name: CINIM_ROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cinim-router-key
                  key: CINIM_ROUTER_KEY
            {{- end }}
          volumeMounts:
            - {name: curve, mountPath: /etc/cinim/curve, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      volumes:
        - name: curve
          secret:
            secretName: {{ required "curve.secretName is required" .Values.curve.secretName }}
            defaultMode: 0440
            # the core's own key pair, and the client pair that it hands to the controller of each organisation (D-24; until the
            # bootstrap token exchange of IAM-003 exists the controllers use the shared client key)
            items:
              - {key: core.pub, path: core.pub}
              - {key: core.key, path: core.key}
              - {key: client.pub, path: client.pub}
              - {key: client.key, path: client.key}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cinim-core
  namespace: {{ include "cinim-shard.ns" . }}
  labels:
    app.kubernetes.io/name: cinim-core
    {{- include "cinim-shard.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: cinim-core
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: controller, port: 19740, targetPort: controller}
    - {name: executor, port: 19741, targetPort: executor}
    - {name: stepreport, port: 19742, targetPort: stepreport}
    - {name: logingest, port: 19743, targetPort: logingest}
