# One replica: the core holds the queue, the leases and the log circuit of the shard in one process (D-23).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinim-core
  namespace: {{ include "cinim-shard.ns" . }}
  labels:
    app.kubernetes.io/name: cinim-core
    {{- include "cinim-shard.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cinim-core
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinim-core
        {{- include "cinim-shard.labels" . | nindent 8 }}
    spec:
      serviceAccountName: cinim-core
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: core
          image: {{ include "cinim-shard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/core"]
          ports:
            - {name: http, containerPort: 18081}
            - {name: stepreport, containerPort: 19742}
            - {name: logingest, containerPort: 19743}
            - {name: artifacts, containerPort: 19744}
            - {name: stream, containerPort: 19745}
          env:
            - {name: CINIM_SHARD, value: {{ .Values.shard | quote }}}
            - {name: CINIM_NAMESPACE_PREFIX, value: {{ .Values.namespacePrefix | quote }}}
            - {name: CINIM_PUBLIC_URL, value: {{ include "cinim-shard.publicUrl" . | quote }}}
            - {name: CINIM_RQLITE_URL, value: {{ include "cinim-shard.rqliteUrl" . | quote }}}
            {{- if .Values.storage.url }}
            # the storage module (D-60, chart cinim-storage): the stores of the shard are its; the core holds its address and the secret its calls are signed with
            - {name: CINIM_STORAGE_URL, value: {{ .Values.storage.url | quote }}}
            - {name: CINIM_STORAGE_DIRECT_URL, value: {{ required "storage.directUrl is required when storage.url is set: the shims send the bytes of artifacts and caches straight to the module (D-61), http://cinim-storage.<namespace>.svc:18091" .Values.storage.directUrl | quote }}}
            - name: CINIM_STORAGE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "storage.tokenSecret.name is required when storage.url is set" .Values.storage.tokenSecret.name }}
                  key: {{ default "token" .Values.storage.tokenSecret.key }}
            {{- end }}
            - {name: CINIM_VICTORIALOGS_URL, value: {{ include "cinim-shard.victoriaLogsUrls" . | quote }}}
            - {name: CINIM_VLAGENT_URL, value: {{ include "cinim-shard.vlagentUrl" . | quote }}}
            - {name: CINIM_METRICS, value: {{ .Values.metrics.enabled | quote }}}
            - {name: CINIM_API_THREADS, value: {{ .Values.core.apiThreads | int | quote }}}
            - {name: CINIM_CERTS, value: /etc/cinim}
            # what the core makes the objects of an organisation from (SHD-007)
            - {name: CINIM_CONTROLLER_IMAGE, value: {{ include "cinim-shard.controllerImage" . | quote }}}
            - {name: CINIM_CONDUCTOR_IMAGE, value: {{ include "cinim-shard.conductorImage" . | quote }}}
            # D-63: a conductor reads the script of a run from a repository (https): the public internet on these ports, and the rules the operator lists
            - {name: CINIM_CONDUCTOR_EGRESS, value: {{ .Values.conductor.egress | toJson | quote }}}
            - {name: CINIM_CONDUCTOR_INTERNET, value: {{ if .Values.conductor.internet.enabled }}{{ dict "ports" .Values.conductor.internet.ports "except" .Values.conductor.internet.except | toJson | quote }}{{ else }}"off"{{ end }}}
            - {name: CINIM_CONTROLLER_STATE_CLASS, value: {{ .Values.controller.stateStorageClass | quote }}}
            - {name: CINIM_STEP_EPHEMERAL_LIMIT, value: {{ .Values.steps.ephemeralStorageLimit | quote }}}
            # the deploy profile (D-48): the namespace of an organisation gets the policies that let a step of the profile reach what the operator lists
            - {name: CINIM_DEPLOY, value: {{ ternary "on" "off" .Values.deploy.enabled | quote }}}
            {{- if .Values.deploy.enabled }}
            - {name: CINIM_DEPLOY_EGRESS, value: {{ .Values.deploy.egress | toJson | quote }}}   # a list of rules, or the string "all"
            - {name: CINIM_DEPLOY_KUBE_APISERVER, value: {{ .Values.deploy.kubeApiServer | quote }}}
            {{- end }}
            # the volume the steps of a run share (STO-001, D-55: it is not optional): the controller of an organisation makes a claim per run; the core says when it may go (STO-006)
            - {name: CINIM_RUN_STORAGE_SIZE, value: {{ .Values.runStorage.size | quote }}}
            - {name: CINIM_RUN_STORAGE_CLASS, value: {{ .Values.runStorage.storageClass | quote }}}
            - {name: CINIM_RUN_STORAGE_ACCESS, value: {{ .Values.runStorage.accessMode | quote }}}
            - {name: CINIM_CACHE_QUOTA, value: {{ dig "quota" 10737418240 (.Values.cache | default dict) | int64 | quote }}}
            - {name: CINIM_CACHE_RETENTION, value: {{ dig "retention" 604800 (.Values.cache | default dict) | int64 | quote }}}
            - {name: CINIM_ARTIFACT_RETENTION, value: {{ dig "retention" 2592000 (.Values.artifacts | default dict) | int64 | quote }}}
            - {name: CINIM_UPLOAD_ABANDON_AFTER, value: {{ dig "abandonAfter" 86400 (.Values.artifacts | default dict) | int64 | quote }}}
            - {name: CINIM_STORAGE_RETENTION_SUCCEEDED, value: {{ .Values.runStorage.retention.succeeded | int64 | quote }}}
            - {name: CINIM_STORAGE_RETENTION_FAILED, value: {{ .Values.runStorage.retention.failed | int64 | quote }}}
            - {name: CINIM_STORAGE_RETENTION_PRESSURE, value: {{ .Values.runStorage.retention.pressure | int64 | quote }}}
            - {name: CINIM_INGRESS_CLASS, value: {{ .Values.ingress.className | quote }}}
            - {name: CINIM_INGRESS_TLS_SECRET, value: {{ .Values.ingress.tls.secretName | quote }}}
            - {name: CINIM_INGRESS_ANNOTATIONS, value: {{ .Values.ingress.annotations | toJson | quote }}}
            # the build profile (D-42, A.13): the namespace of an organisation is `baseline` under the build-pod policy of this chart, and the
            # controller of the organisation makes a build Pod of a step that asks for it
            - {name: CINIM_BUILD, value: {{ ternary "on" "off" .Values.build.enabled | quote }}}
            {{- if .Values.build.enabled }}
            - {name: CINIM_BUILD_EGRESS, value: {{ .Values.build.egress | toJson | quote }}}   # a list of rules, or the string "all"
            - {name: CINIM_BUILD_INTERNET, value: {{ if .Values.build.internet.enabled }}{{ dict "ports" .Values.build.internet.ports "except" .Values.build.internet.except | toJson | quote }}{{ else }}"off"{{ end }}}
            - {name: CINIM_BUILD_CAPS, value: {{ join "," .Values.build.capabilities | quote }}}
            - {name: CINIM_BUILD_MEMORY_LIMIT, value: {{ .Values.build.memoryLimit | quote }}}
            - {name: CINIM_BUILD_CPU_REQUEST, value: {{ .Values.build.cpuRequest | quote }}}
            - {name: CINIM_BUILD_CPU_LIMIT, value: {{ .Values.build.cpuLimit | quote }}}
            - {name: CINIM_BUILD_EPHEMERAL_LIMIT, value: {{ .Values.build.ephemeralStorageLimit | quote }}}
            - {name: CINIM_BUILD_SECCOMP, value: {{ .Values.build.seccompProfile | quote }}}
            - {name: CINIM_BUILD_INGRESS, value: {{ .Values.build.ingress | toJson | quote }}}   # a list of rules, or the string "all"
            {{- end }}
            {{- if .Values.secrets.keyService.url }}
            # the master key of the step secrets lives on a token behind a key service with the Transit API (hsmgate; docs/hardware-key.md, core/transitclient.nim)
            - {name: CINIM_KEYSERVICE_URL, value: {{ .Values.secrets.keyService.url | quote }}}
            - {name: CINIM_KEYSERVICE_KEY_NAME, value: {{ .Values.secrets.keyService.keyName | quote }}}
            {{- if .Values.secrets.keyService.mount }}
            - {name: CINIM_KEYSERVICE_MOUNT, value: {{ .Values.secrets.keyService.mount | quote }}}
            {{- end }}
            {{- if .Values.secrets.keyService.tlsSecret }}
            - {name: CINIM_KEYSERVICE_CA, value: /etc/cinim-keyservice/ca.crt}
            - {name: CINIM_KEYSERVICE_CERT, value: /etc/cinim-keyservice/tls.crt}
            - {name: CINIM_KEYSERVICE_KEY, value: /etc/cinim-keyservice/tls.key}
            {{- end }}
            {{- else if .Values.secrets.keySecret }}
            # the master key of the step secrets (core/secretvault.nim); without one it is derived from the CURVE key
            - {name: CINIM_SECRETS_KEY_FILE, value: /etc/cinim-secrets/key}
            {{- end }}
            {{- if .Values.auth.enabled }}
            # IAM-003: without a token or CINIM_AUTH=on the API is open
            - {name: CINIM_AUTH, value: "on"}
            - {name: CINIM_PWNED_CHECK, value: {{ .Values.auth.pwnedCheck | quote }}}     # IAM-001: a new password is looked up in Pwned Passwords (k-anonymity); "off" for a shard with no way out
            {{- if .Values.auth.pwnedUrl }}
            - {name: CINIM_PWNED_URL, value: {{ .Values.auth.pwnedUrl | quote }}}
            {{- end }}
            {{- if or .Values.auth.adminToken .Values.auth.adminTokenSecret }}
            - name: CINIM_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ default "cinim-admin-token" .Values.auth.adminTokenSecret }}
                  key: token
            {{- end }}
            {{- end }}
            # the reconciliation of the organisations with their objects and the retention of a switched-off one (SHD-008)
            - {name: CINIM_ORG_RECONCILE_INTERVAL, value: {{ int64 .Values.organizations.reconcileInterval | quote }}}
            # int64: Helm reads a YAML integer as a float, and 1209600 would be printed as 1.2096e+06
            - {name: CINIM_ORG_RETENTION, value: {{ int64 .Values.organizations.retention | quote }}}
            - {name: CINIM_ORG_PURGE_GRACE, value: {{ int64 .Values.organizations.purgeGrace | quote }}}
            # the simple mode of a small organisation (SHD-009): every step Pod may reach any address / be reached from any
            - {name: CINIM_NETWORK_EGRESS, value: {{ .Values.network.egress | quote }}}
            - {name: CINIM_NETWORK_INGRESS, value: {{ .Values.network.ingress | quote }}}
            {{- if eq .Values.mode "multi" }}
            - {name: CINIM_ROUTER_URL, value: {{ required "routerUrl is required in the multi mode" .Values.routerUrl | quote }}}
            - {name: CINIM_ROUTER_INTERVAL, value: {{ .Values.routerInterval | quote }}}
            - name: CINIM_ROUTER_KEY
              valueFrom:
                secretKeyRef:
                  name: cinim-router-key
                  key: CINIM_ROUTER_KEY
            {{- end }}
          volumeMounts:
            - {name: curve, mountPath: /etc/cinim/curve, readOnly: true}
            {{- if .Values.secrets.keySecret }}
            - {name: secrets-key, mountPath: /etc/cinim-secrets, readOnly: true}
            {{- end }}
            {{- if and .Values.secrets.keyService.url .Values.secrets.keyService.tlsSecret }}
            - {name: keyservice-tls, mountPath: /etc/cinim-keyservice, readOnly: true}
            {{- end }}
            - {name: tmp, mountPath: /tmp}
          # ready: the database answers (/readyz; not ready leaves the Pod out of the Service and does not restart it). Alive: none of the threads that take the log, the reports and the
          # artifacts is stuck (/healthz, core/health.nim); a core that is alive and not moving is restarted after two minutes.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 4
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.core.resources | nindent 12 }}
      volumes:
        - name: curve
          secret:
            secretName: {{ required "curve.secretName is required" .Values.curve.secretName }}
            defaultMode: 0440
            # the core's own key pair, and the client pair that it hands to the controller of each organisation (D-24; until the
            # bootstrap token exchange of IAM-003 exists the controllers use the shared client key)
            items:
              - {key: core.pub, path: core.pub}
              - {key: core.key, path: core.key}
              - {key: client.pub, path: client.pub}
              - {key: client.key, path: client.key}
        {{- if and .Values.secrets.keyService.url .Values.secrets.keyService.tlsSecret }}
        - name: keyservice-tls
          secret:
            secretName: {{ .Values.secrets.keyService.tlsSecret }}
            defaultMode: 0440
        {{- end }}
        {{- if .Values.secrets.keySecret }}
        - name: secrets-key
          secret:
            secretName: {{ .Values.secrets.keySecret }}
            defaultMode: 0440
            items:
              - {key: key, path: key}
        {{- end }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cinim-core
  namespace: {{ include "cinim-shard.ns" . }}
  labels:
    app.kubernetes.io/name: cinim-core
    {{- include "cinim-shard.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: cinim-core
  ports:
    - {name: http, port: 80, targetPort: http}
    - {name: stepreport, port: 19742, targetPort: stepreport}
    - {name: logingest, port: 19743, targetPort: logingest}
    - {name: artifacts, port: 19744, targetPort: artifacts}
    - {name: stream, port: 19745, targetPort: stream}
