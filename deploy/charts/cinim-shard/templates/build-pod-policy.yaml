{{- if .Values.build.enabled }}
# The build-pod policy (D-42, A.13, deploy/examples/build-pods/policy.yaml is the same text to try by hand): the namespace of an organisation
# is Pod Security `baseline` by label when the shard has a build profile, and this policy adds what `restricted` has over `baseline` to every
# Pod in it but a build Pod (label cinim.io/profile=build). A build Pod must be made by the job controller of the namespace, run in a user
# namespace of its own (hostUsers: false), use the RuntimeDefault seccomp profile or the Localhost profile profiles/cinim-userns.json
# (deploy/seccomp, on every node) and add no capability but CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETFCAP. It applies to the
# namespaces of this shard that carry cinim.io/build-pod-policy=on (the core sets it). Needs Kubernetes 1.30+.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "cinim-shard.ns" . }}-build-pods
  labels:
    {{- include "cinim-shard.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    namespaceSelector: {matchLabels: {cinim.io/build-pod-policy: "on", cinim.io/shard: {{ .Values.shard | quote }}}}
    resourceRules:
      - {apiGroups: [""], apiVersions: ["v1"], operations: [CREATE], resources: [pods]}
  variables:
    - name: containers
      expression: >-
        object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: isBuild
      expression: "has(object.metadata.labels) && 'cinim.io/profile' in object.metadata.labels && object.metadata.labels['cinim.io/profile'] == 'build'"
    - name: podSec
      expression: "has(object.spec.securityContext) ? object.spec.securityContext : {}"
    - name: volumes
      expression: "has(object.spec.volumes) ? object.spec.volumes : []"
  validations:
    # --- what `restricted` adds to `baseline`: for every Pod that is not a build Pod
    - expression: >-
        variables.isBuild || variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
        c.securityContext.allowPrivilegeEscalation == false)
      message: "a Pod that is not a build Pod must set allowPrivilegeEscalation=false in every container"
    - expression: >-
        variables.isBuild || variables.containers.all(c, has(c.securityContext) && has(c.securityContext.capabilities) &&
        has(c.securityContext.capabilities.drop) && 'ALL' in c.securityContext.capabilities.drop &&
        (!has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x == 'NET_BIND_SERVICE')))
      message: "a Pod that is not a build Pod must drop ALL capabilities and may add only NET_BIND_SERVICE"
    - expression: >-
        variables.isBuild || variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.runAsNonRoot) ? c.securityContext.runAsNonRoot :
        (has(variables.podSec.runAsNonRoot) ? variables.podSec.runAsNonRoot : false)) == true)
      message: "a Pod that is not a build Pod must run as non-root (runAsNonRoot: true)"
    - expression: >-
        variables.isBuild || (!has(variables.podSec.runAsUser) || variables.podSec.runAsUser != 0) &&
        variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.runAsUser) || c.securityContext.runAsUser != 0)
      message: "a Pod that is not a build Pod may not run as user 0"
    - expression: >-
        variables.isBuild || variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.seccompProfile) ? c.securityContext.seccompProfile.type :
        (has(variables.podSec.seccompProfile) ? variables.podSec.seccompProfile.type : 'none')) in ['RuntimeDefault', 'Localhost'])
      message: "a Pod that is not a build Pod must use the RuntimeDefault or a Localhost seccomp profile"
    # --- the volume types that `restricted` allows are configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected and
    # secret; `baseline` forbids only hostPath, so the others are named here (for every Pod, build Pods included)
    - expression: >-
        variables.volumes.all(v, !has(v.awsElasticBlockStore) && !has(v.azureDisk) && !has(v.azureFile) && !has(v.cephfs) && !has(v.cinder) &&
        !has(v.fc) && !has(v.flexVolume) && !has(v.flocker) && !has(v.gcePersistentDisk) && !has(v.gitRepo) && !has(v.glusterfs) && !has(v.iscsi) &&
        !has(v.nfs) && !has(v.photonPersistentDisk) && !has(v.portworxVolume) && !has(v.quobyte) && !has(v.rbd) && !has(v.scaleIO) &&
        !has(v.storageos) && !has(v.vsphereVolume))
      message: "the volume type is not one that Pod Security restricted allows (configMap, csi, downwardAPI, emptyDir, ephemeral, persistentVolumeClaim, projected, secret)"
    # --- a build Pod
    - expression: "!variables.isBuild || request.userInfo.username == 'system:serviceaccount:' + request.namespace + ':cinim-job-controller'"
      message: "only the job controller of the namespace may make a build Pod"
    - expression: "!variables.isBuild || (has(object.spec.hostUsers) && object.spec.hostUsers == false)"
      message: "a build Pod must run in a user namespace of its own (hostUsers: false)"
    - expression: >-
        !variables.isBuild || variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.seccompProfile) ? c.securityContext.seccompProfile :
        (has(variables.podSec.seccompProfile) ? variables.podSec.seccompProfile : {'type': 'none'})).type in ['RuntimeDefault', 'Localhost'] &&
        ((has(c.securityContext) && has(c.securityContext.seccompProfile) ? c.securityContext.seccompProfile :
        (has(variables.podSec.seccompProfile) ? variables.podSec.seccompProfile : {'type': 'none'})).type == 'RuntimeDefault' ||
        (has(c.securityContext) && has(c.securityContext.seccompProfile) ? c.securityContext.seccompProfile.localhostProfile :
        (has(variables.podSec.seccompProfile) ? variables.podSec.seccompProfile.localhostProfile : '')) == 'profiles/cinim-userns.json'))
      message: "a build Pod must use the RuntimeDefault seccomp profile or the Localhost profile profiles/cinim-userns.json"
    - expression: >-
        !variables.isBuild || variables.containers.all(c, !has(c.securityContext) || !has(c.securityContext.capabilities) ||
        !has(c.securityContext.capabilities.add) || c.securityContext.capabilities.add.all(x, x in ['CHOWN', 'DAC_OVERRIDE', 'FOWNER', 'SETUID', 'SETGID', 'SETFCAP']))
      message: "a build Pod may add only CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID, SETFCAP"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "cinim-shard.ns" . }}-build-pods
  labels:
    {{- include "cinim-shard.labels" . | nindent 4 }}
spec: {policyName: {{ include "cinim-shard.ns" . }}-build-pods, validationActions: [Deny]}
{{- end }}
