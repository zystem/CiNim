{{- if .Values.executor.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cinim-executor
  namespace: {{ include "cinim-shard.ns" . }}
  labels:
    app.kubernetes.io/name: cinim-executor
    {{- include "cinim-shard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cinim-executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cinim-executor
        {{- include "cinim-shard.labels" . | nindent 8 }}
    spec:
      serviceAccountName: cinim-executor
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: {{ include "cinim-shard.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/executor"]
          env:
            - {name: CINIM_CORE_ADDR, value: "tcp://cinim-core:19741"}
            - {name: CINIM_CERTS, value: /etc/cinim}
          volumeMounts:
            - {name: curve, mountPath: /etc/cinim/curve, readOnly: true}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.executor.resources | nindent 12 }}
      volumes:
        - name: curve
          secret:
            secretName: {{ required "curve.secretName is required" .Values.curve.secretName }}
            defaultMode: 0440
            # the core's public key to pin and the client key pair; core.key stays out of this Pod
            items:
              - {key: core.pub, path: core.pub}
              - {key: client.pub, path: client.pub}
              - {key: client.key, path: client.key}
{{- end }}
