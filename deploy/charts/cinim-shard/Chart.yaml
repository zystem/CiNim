apiVersion: v2
name: cinim-shard
description: One shard of CiNim (SHD-001..SHD-008) in a single release - the core, the pipeline executor, the access rights for creating organisations, the Ingress of the shard and, as subcharts, rqlite and the log circuit (two VictoriaLogs nodes and vlagent).
type: application
version: 0.1.0
appVersion: "0.1.0"
dependencies:
  # the shard's own database (D-04); official chart
  - name: rqlite
    version: 2.0.0
    repository: https://rqlite.github.io/helm-charts
    condition: rqlite.enabled
  # the log circuit (D-27, DAT-010): two independent VictoriaLogs nodes fed by one vlagent; official charts
  - name: victoria-logs-single
    alias: victorialogs-0
    version: 0.13.10
    repository: https://victoriametrics.github.io/helm-charts
    condition: logs.enabled
  - name: victoria-logs-single
    alias: victorialogs-1
    version: 0.13.10
    repository: https://victoriametrics.github.io/helm-charts
    condition: logs.enabled
  - name: victoria-logs-agent
    alias: vlagent
    version: 0.2.10
    repository: https://victoriametrics.github.io/helm-charts
    condition: logs.enabled
