repositories:
  - name: rqlite
    url: https://rqlite.github.io/helm-charts
  - name: vm
    url: https://victoriametrics.github.io/helm-charts

---
releases:
  - name: rqlite
    namespace: rqlite
    chart: rqlite/rqlite
    version:
    values:
      - image:
          tag: latest
        replicaCount: 3
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
        persistence:
          enabled: true
          size: 10Gi

  # Log circuit (A.7, D-27) for tests: one VictoriaLogs node. The launch gate (RUN-015, A.10) watches the node's /health and
  # vlagent. A production shard runs two independent nodes (DAT-010).
  - name: victorialogs
    namespace: victorialogs
    chart: vm/victoria-logs-single
    version: 0.13.10
    values:
      - server:
          fullnameOverride: victorialogs
          replicaCount: 1
          retentionPeriod: "1"
          persistentVolume:
            enabled: true
              size: 5Gi
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi

  # vlagent: the collector (src/core/logcollector.nim) posts NDJSON to vlagent's own /insert/jsonline
  # (port 9429); vlagent replicates to the VictoriaLogs node above via its native protocol (remoteWrite
  # url with no path, per the chart's own default) with its own per-destination disk buffer.
  - name: vlagent
    namespace: victorialogs
    chart: vm/victoria-logs-agent
    version: 0.2.10
    values:
      - fullnameOverride: vlagent
        remoteWrite:
          - url: http://victorialogs.victorialogs.svc:9428
        maxDiskUsagePerURL: 1GiB
        persistentVolume:
          enabled: true
          size: 2Gi
        service:
          enabled: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
