// ExecutorChannel (9.2, RUN-008, PIP-003/004): executor <-> scheduler. The only channel of the sandbox.
// Pattern proposal (A.3): the executor is the REQ side; each host call is one request and the reply completes it.
syntax = "proto3";

package cicd.internal.v1;

import "cicd/internal/v1/common.proto";

// One record of the append-only run journal (PIP-003, SEC-008).
message JournalEntry {
  uint64 seq = 1;
  string kind = 2;                   // now | random | sleep | job | sh | use | env | parallel | spawn | wait | input | run | ...
  bytes payload = 3;                 // canonical JSON of the call arguments (sorted keys); part of the fingerprint
  bytes result = 4;                  // canonical JSON of the result
  bytes hash = 5;                    // SHA-256(prev_hash || seq || kind || payload || result), length-prefixed fields
}

message LeaseRequest {
  string run_id = 1;                 // empty means "assign the next available run" (RUN-009)
  string executor_id = 2;
  string lease_token = 3;            // proves ownership after a scheduler restart (RUN-008)
  repeated uint32 api_versions = 4;  // the versions of the Lua host API this executor can run (PIP-001); none: an executor from before them, version 1
}

// What a conductor (docs/conductors.md) says to the core on the push channel when it connects, when its free places change, and every few seconds.
// The credential is the conductor's (IAM-003): the core makes it for the namespace's controller, which gives it to the conductor's Pod.
message ConductorHello {
  string conductor_id = 1;
  string namespace = 2;               // the organisation's namespace; the conductor leads the runs of that organisation only
  string credential = 3;
  repeated uint32 api_versions = 4;   // the versions of the Lua host API it can run (PIP-001)
  uint32 free_places = 5;             // how many more runs it can take (of runs_per_conductor): the credit of the core's leases
  repeated string held_runs = 6;      // the runs it holds now, so that the core and the conductor agree after a reconnect
}

message HostCall {
  string run_id = 1;
  string lease_token = 2;
  uint64 seq = 3;                    // the journal position this call would occupy
  string kind = 4;
  bytes payload = 5;
  bool numbered = 6;                 // the executor gave this step a number from its table (docs/parallel.md section 3): `step_no`; false: an executor from before the tables, the number is `seq`
  uint32 step_no = 7;                // the number of the step (StepRef.seq); need not be `seq`, the place in the journal
}

message HostResult {
  uint64 seq = 1;
  bytes result = 2;                  // empty while suspended
  bool suspended = 3;                // waiting for a step, approval or timer: the executor releases the run
  Failure failure = 4;               // limit exceeded, script_nondeterminism, ...
}

message FinishRun {
  string run_id = 1;
  RunState state = 2;                // terminal state: SUCCEEDED, FAILED, INFRASTRUCTURE_ERROR
  string message = 3;                 // the detail when not SUCCEEDED: the script's error, the parameter that was refused, the limit that was hit
  string code = 4;                    // script_error, script_nondeterminism, instruction_limit, ... (replay.nim ExecResult.code); "" when SUCCEEDED
  string lease_token = 5;              // the lease of the run (RUN-008): the finish of a run one does not hold is refused
}

message ExecutorRequest {
  Header header = 1;
  oneof body {
    LeaseRequest lease = 2;
    HostCall call = 3;
    string finish_run_id = 4;          // unused (kept for wire compat, N/N-1); use finish
    FinishRun finish = 5;               // carries the terminal state, finish_run_id did not
  }
}

message ExecutorResponse {
  Header header = 1;
  oneof body {
    LeaseGranted lease = 2;
    HostResult result = 3;
    Failure failure = 4;
  }
}

message LeaseGranted {
  string lease_token = 1;
  uint32 ttl_seconds = 2;
  repeated JournalEntry journal = 3;  // to replay; paged for long journals
  bool more = 4;
  string script = 5;                  // the run's Lua source, sent with the lease (there is no
                                       // pipeline_bundles/blob storage yet, spec 8.2 pipeline_bundles.digest)
  map<string, string> params = 7;    // the launch parameters given when the run was created (PIP-012), as text; the script's declarations type and complete them
  uint32 api_version = 8;            // the version of the Lua host API the run was made with: the executor replays it with the prelude of that version
  string step_table = 9;              // the table of step numbers of the run (executor/steptable.nim) as the executor sent it with its first lease; "" until it has
  string run_id = 6;                  // which run this lease is for (echoes a non-empty request, or
                                       // resolves "any available run")
}
