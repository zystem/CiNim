// ControllerAttach (9.2, RUN-002, RUN-015, IAM-003): the job controller dials the scheduler (outbound only).
// Pattern proposal (A.3): the controller is the REQ side and polls; every poll carries acknowledgements and events,
// the answer carries commands. This gives back-pressure and idempotent redelivery without a bidirectional stream.
syntax = "proto3";

package cicd.internal.v1;

import "cicd/internal/v1/common.proto";
import "google/protobuf/timestamp.proto";

message RegisterRequest {
  Header header = 1;
  string bootstrap_token = 2;        // one-time token, exchanged for the mTLS identity (IAM-003)
  string profile = 3;                // execution profile served by this controller (RUN-004)
  uint32 max_pods = 4;
}

message RegisterResponse {
  Header header = 1;
  string controller_id = 2;
  string session_id = 3;
  uint32 poll_interval_ms = 4;
  Failure failure = 5;               // set when registration is refused
}

// A transition observed on a Pod (watch), reported to the scheduler (RUN-002: only transitions, no heartbeat per step).
message PodTransition {
  StepRef step = 1;
  StepState state = 2;
  string pod_name = 3;
  string node = 4;
  int32 exit_code = 5;
  string termination_reason = 6;     // "ok", "failed", "env_rejected", ...
  google.protobuf.Timestamp observed_at = 7;
  string shim_state_json = 8;        // the newest CICD-SHIM state found in the Pod's log (D-29); "" = none seen
}

// What the controller found in the cluster for one step Pod (D-29): read from the Kubernetes API by label, not
// from the controller's own memory, so it stays true across controller restarts and missed events.
message PodInfo {
  StepRef step = 1;
  string pod_name = 2;
  string phase = 3;                  // Pending | Running | Succeeded | Failed | Unknown
  bool command_started = 4;
  string node = 5;
  string shim_state_json = 6;        // the newest CICD-SHIM state in the Pod's log tail (read every few seconds)
}

// A finished step Pod that the controller keeps because core could not read from it what it needs: the result is unknown (the node was lost, the shim
// went silent, the Pod vanished) or the log did not reach the log store. It is kept 14 days to be looked at, and core shows an alert for it.
message KeptPod {
  StepRef step = 1;
  string pod_name = 2;
  string reason = 3;                 // why it was not fully read: "logs_undelivered", "outcome_unknown", "lost_never_started"
  int64 reported_at = 4;             // unix seconds: when core was told how the step ended
  int64 keep_until = 5;              // unix seconds: when the controller removes the Pod
}

message PollRequest {
  Header header = 1;
  string session_id = 2;
  uint64 ack_command_seq = 3;        // all commands up to this sequence were applied
  repeated PodTransition transitions = 4;
  uint32 free_pod_slots = 5;
  ComponentStatus status = 6;        // D-29: who the controller is and how it is (every poll is also its heartbeat)
  repeated PodInfo inventory = 7;    // every step Pod the controller can see (sent every few seconds, see inventory_complete)
  bool inventory_complete = 8;       // true: `inventory` is the whole list (an empty list then means "no Pods at all");
                                     // false: no inventory this time, or the list call failed - core must conclude nothing
  string namespace = 9;              // SHD-007: the namespace of the organisation this controller serves; core assigns it the steps of the
                                     // execution profile of that namespace only. Empty: the shard's default profile (single-tenant setups)
  string credential = 10;            // IAM-003: the controller's credential for that namespace, sent in every poll once it has one
  string bootstrap_token = 11;       // IAM-003: before it has one, the one-time token from the Secret that core made with the namespace;
                                     // core answers with `issued_credential`
  repeated KeptPod kept = 12;        // the Pods kept because they were not fully read, newest first, at most 100 (the whole list is `kept_total`)
  uint32 kept_total = 13;
  bool kept_complete = 14;           // true: `kept` and `kept_total` are the whole picture (an empty list then means "none"); core replaces what it had
}

message StartStep {
  StepRef step = 1;
  string image = 2;
  repeated string command = 3;
  map<string, string> env = 4;       // non-secret environment
  repeated string secret_handles = 5;  // names only; the controller creates the ephemeral Secret (6.7)
  bool workspace_isolated = 6;
  uint32 timeout_seconds = 7;
  uint64 log_max_bytes = 9;          // the profile's per-step log limit (0 = unlimited): the shim cuts the log there, with a marker
  uint64 log_spool_bytes = 10;       // the profile's spool size on the Pod (0 = the controller's default)
  uint32 log_hold_timeout_seconds = 11;  // the profile's wait for log delivery / core after the command ends (0 = default)
  string profile = 12;               // D-42: the profile the step asked for ("" = ordinary, "build" = an image build): the controller picks the Pod's security class from it
  string opts_json = 8;              // the Lua step options as one canonical JSON object: mask, metrics, timeout (docs/metrics.md, docs/secrets-masking.md); "" = none
}

message CancelStep {
  StepRef step = 1;
  uint32 grace_seconds = 2;          // RUN-006
}

message GateState {
  bool open = 1;                     // RUN-015: false means "do not create new Pods"
  string reason = 2;                 // "logs_unavailable" when closed
}

message Command {
  uint64 seq = 1;
  oneof body {
    StartStep start = 2;
    CancelStep cancel = 3;
    GateState gate = 4;
  }
}

message PollResponse {
  Header header = 1;
  repeated Command commands = 2;
  GateState gate = 3;
  uint32 poll_after_ms = 4;
  Failure failure = 5;
  string issued_credential = 6;      // answer to a valid bootstrap_token: the credential to keep and to send in every later poll
  bool unauthorized = 7;             // the namespace has a controller identity and the poll did not prove it: nothing was done
}
